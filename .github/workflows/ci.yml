name: Independent consumer checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  application:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11.18', '3.13.18']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: '0.13.6'
          python-version: ${{ matrix.python }}
          enable-cache: false
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check src tests scripts
      - run: uv run --locked pytest -q --tb=short --no-showlocals
      - run: uv build
  collector:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: '0.13.6'
          python-version: '3.11.18'
          enable-cache: false
      - run: uv sync --locked --extra cutback
      - run: uv run --locked --extra cutback pytest -q --tb=short --no-showlocals
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: uv run --locked --extra cutback python scripts/check_collector.py
        env:
          EXAMPLE_CHECK_BROWSER: 'true'
      - name: Stop this example's owned collector
        if: always()
        run: uv run --locked --extra cutback python -m example_supportdesk.local down
