[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "cutback-support-desk-example"
version = "0.1.0"
description = "An independent synthetic support application for learning AI observability"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["fastapi==0.162.0", "uvicorn==0.54.0", "httpx==0.28.1", "openai==2.29.0"]

[project.optional-dependencies]
cutback = ["cutback[server,openai] @ git+https://github.com/CutbackAI/cutback.git@98a212047015b411143f0d1e0a782232a1aea2f6"]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff>=0.14,<1"]

[project.scripts]
support-desk = "example_supportdesk.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/example_supportdesk"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
